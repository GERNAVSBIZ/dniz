<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal DNIZ - Nav Brasil</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        nav: {
                            blue: '#002855', // Azul Institucional Profundo
                            yellow: '#fbbf24', // Amarelo de destaque
                            light: '#f3f4f6',
                            dark: '#111827'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-nav-blue text-white shadow-lg border-b-4 border-yellow-500">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-4 mb-4 md:mb-0">
                <!-- Icone Nav Brasil Simulado -->
                <div class="bg-white p-2 rounded-full text-nav-blue">
                    <i data-lucide="plane" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide">PORTAL DNIZ</h1>
                    <p class="text-xs text-slate-300 uppercase tracking-wider">Nav Brasil - Imperatriz (SBIZ)</p>
                </div>
            </div>

            <!-- Relógios -->
            <div class="flex space-x-6 bg-white/10 p-3 rounded-lg backdrop-blur-sm font-mono">
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 uppercase">UTC (Z)</p>
                    <p id="clock-utc" class="text-xl font-bold text-yellow-400">00:00:00</p>
                </div>
                <div class="w-px bg-white/20"></div>
                <div class="text-center">
                    <p class="text-[10px] text-slate-400 uppercase">Local (L)</p>
                    <p id="clock-local" class="text-xl font-bold text-white">00:00:00</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-10">
        
        <!-- Search / Filter -->
        <div class="max-w-md mx-auto mb-10 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-5 w-5 text-gray-400"></i>
            </div>
            <input type="text" id="searchInput" placeholder="Buscar sistema..." 
                class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-lg leading-5 bg-white placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm transition duration-150 ease-in-out sm:text-sm">
        </div>

        <!-- Systems Grid -->
        <div id="systems-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards serão inseridos via JavaScript -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="no-results" class="hidden text-center py-10">
            <i data-lucide="inbox" class="mx-auto h-12 w-12 text-gray-300"></i>
            <p class="mt-2 text-gray-500">Nenhum sistema encontrado.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-8">
        <div class="container mx-auto px-4 text-center">
            <p class="text-sm text-slate-500">
                &copy; <span id="year"></span> DNIZ Imperatriz - Nav Brasil.
            </p>
            <p class="text-xs text-slate-400 mt-1">Desenvolvido para apoio operacional.</p>
        </div>
    </footer>

    <script>
        // --- CONFIGURAÇÃO DOS SISTEMAS ---
        // Para adicionar novos sistemas, basta adicionar um novo objeto nesta lista abaixo:
        const systemsData = [
            {
                title: "Análise de Tráfego",
                url: "https://analisetrafego.onrender.com/",
                description: "Estatísticas detalhadas, fluxo de aeronaves e dados históricos de movimento.",
                icon: "bar-chart-3",
                color: "text-blue-600",
                bg: "bg-blue-50"
            },
            {
                title: "Escala DNIZ",
                url: "https://gernavsbiz.github.io/escaladniz/",
                description: "Gerenciamento de turnos, escalas de serviço e planejamento de equipes.",
                icon: "calendar-days",
                color: "text-green-600",
                bg: "bg-green-50"
            },
            {
                title: "Monitoramento",
                url: "https://gernavsbiz.github.io/monitoramento/",
                description: "Dashboard de status operacional em tempo real e alertas do sistema.",
                icon: "activity",
                color: "text-red-600",
                bg: "bg-red-50"
            },
            {
                title: "METAR Geral",
                url: "https://metargeral.vercel.app/",
                description: "Consulta meteorológica aeronáutica, TAF, METAR e condições de tempo.",
                icon: "cloud-sun",
                color: "text-sky-500",
                bg: "bg-sky-50"
            },
            {
                title: "Mural Digital",
                url: "https://gernavsbiz.github.io/mural/index.html?unidade=DNIZ",
                description: "Avisos importantes, circulares e informações gerais da unidade.",
                icon: "layout-dashboard",
                color: "text-purple-600",
                bg: "bg-purple-50"
            },
            {
                title: "Gerenciador de Cobrança",
                url: "https://gernavsbiz.pythonanywhere.com/",
                description: "Gerenciamento de tarifas, boletos e ferramentas administrativas.",
                icon: "receipt",
                color: "text-slate-600",
                bg: "bg-slate-100"
            },
            {
                title: "Mural Digital ADM",
                url: "https://gernavsbiz.github.io/mural/admin.html",
                description: "Avisos importantes, circulares e informações gerais da unidade.",
                icon: "layout-dashboard",
                color: "text-purple-600",
                bg: "bg-purple-50"
            },
            {
                title: "METAR RELATÓRIO",
                url: "https://metargeral.vercel.app/metar_relatorio.html",
                description: "Consulta meteorológica aeronáutica, TAF, METAR e condições de tempo.",
                icon: "cloud-sun",
                color: "text-sky-500",
                bg: "bg-sky-50"
            },
            {
                title: "PORTAL AVSEC",
                url: "https://gernavsbiz.github.io/avsec/#avsec",
                description: "Orientações AVSEC",
                icon: "shield-alert",
                color: "text-sky-500",
                bg: "bg-sky-50"
            }
            // --- INSIRA NOVOS SISTEMAS AQUI ---
            /*
            Exemplo de novo sistema:
            {
                title: "Nome do Novo Sistema",
                url: "https://link-do-novo-sistema.com/",
                description: "Breve descrição sobre a função do sistema.",
                icon: "package", // Escolha um ícone em https://lucide.dev/icons
                color: "text-indigo-600",
                bg: "bg-indigo-50"
            },
            */
        ];

        // --- LÓGICA DE RENDERIZAÇÃO ---
        const grid = document.getElementById('systems-grid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('no-results');

        function renderCards(filterText = '') {
            grid.innerHTML = '';
            let visibleCount = 0;

            systemsData.forEach(sys => {
                // Filtro simples
                if (sys.title.toLowerCase().includes(filterText.toLowerCase()) || 
                    sys.description.toLowerCase().includes(filterText.toLowerCase())) {
                    
                    const card = document.createElement('a');
                    card.href = sys.url;
                    card.target = "_blank"; // Abre em nova aba
                    card.className = "block bg-white rounded-xl border border-slate-200 p-6 card-hover relative overflow-hidden group";
                    
                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-4">
                            <div class="p-3 rounded-lg ${sys.bg} ${sys.color}">
                                <i data-lucide="${sys.icon}" class="w-8 h-8"></i>
                            </div>
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-400">
                                <i data-lucide="external-link" class="w-5 h-5"></i>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-blue-700 transition-colors">${sys.title}</h3>
                        <p class="text-slate-500 text-sm leading-relaxed">${sys.description}</p>
                    `;
                    
                    grid.appendChild(card);
                    visibleCount++;
                }
            });

            // Renderiza ícones novamente após inserir no DOM
            lucide.createIcons();

            // Toggle mensagem de nenhum resultado
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // --- RELÓGIO ---
        function updateClock() {
            const now = new Date();
            
            // UTC
            const utcHours = String(now.getUTCHours()).padStart(2, '0');
            const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
            const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('clock-utc').textContent = `${utcHours}:${utcMinutes}:${utcSeconds}`;

            // Local
            const localHours = String(now.getHours()).padStart(2, '0');
            const localMinutes = String(now.getMinutes()).padStart(2, '0');
            const localSeconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-local').textContent = `${localHours}:${localMinutes}:${localSeconds}`;
        }

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            // Render inicial
            renderCards();
            
            // Listener do filtro
            searchInput.addEventListener('input', (e) => {
                renderCards(e.target.value);
            });

            // Inicia relógio
            setInterval(updateClock, 1000);
            updateClock();

            // Ano atual no footer
            document.getElementById('year').textContent = new Date().getFullYear();
        });

    </script>
</body>
</html>
